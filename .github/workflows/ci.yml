name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialize deploys: gh-deploy force-pushes gh-pages, so two runs racing (e.g. a
# code change + its `chore: update v2 site content` pair from `just deploy-v2`)
# would each force-push and the last to finish wins — which can be the *earlier*
# build, publishing stale HTML. Queue rather than cancel so a superseding run can't
# skip the final deploy (cancelling could drop the newest content). See FOLLOWUPS #22.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Shallow: gh-deploy (ghp-import) force-pushes a fresh gh-pages branch and
          # needs no main history; full history was ~248s/run over an ~800MB repo. No
          # build plugin (search/roamlinks/awesome-nav) reads git history.
          # See v2/.repo-docs/decisions/2026-06-05-ci-deploy-build-time-perf.md.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache site build
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-site-cache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-site-cache-

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-roamlinks-plugin mkdocs-awesome-nav

      # Stamp the v2 build version into mkdocs.yml just before deploy. $GITHUB_SHA
      # is the commit being deployed (no chicken-and-egg). Targeted sed on the
      # placeholder lines avoids a YAML parser stripping mkdocs.yml's comments and
      # choking on its !!python/name: tags. Not committed back — gh-deploy only
      # force-pushes the built site to gh-pages.
      - name: Stamp site build version
        run: |
          sed -i -E "s|^(  site_sha:).*|\1 \"${GITHUB_SHA::7}\"|" mkdocs.yml
          sed -i -E "s|^(  site_date:).*|\1 \"$(date +%F)\"|" mkdocs.yml

      - run: mkdocs gh-deploy --force
